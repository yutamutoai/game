<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マインスイーパ - 完全版</title>
    <style>
        :root {
            --bg-color: #e2e8f0;
            --wrapper-bg: #ffffff;
            --text-color: #0f172a;
            --header-bg: #f8fafc;
            --header-border: #cbd5e1;
            --header-btn-bg: #e2e8f0;
            --header-btn-color: #0f172a;
            --board-border: #64748b;
            --cell-bg: #94a3b8;       /* 未発掘：しっかりとしたグレー */
            --cell-hover: #cbd5e1;      /* 未発掘ホバー */
            --cell-revealed: #f8fafc;   /* 掘ったところ：明るい白系でくっきり差別化 */
            --mode-btn-bg: #f8fafc;
            --mode-btn-border: #cbd5e1;
            --mode-btn-color: #0f172a;
            --modal-bg: #ffffff;
            --modal-desc: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        .game-wrapper {
            background: var(--wrapper-bg);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            max-height: 100vh;
        }

        /* メニュー画面 & サブ画面共通 */
        #menuScreen, #scoreScreen {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .menu-card {
            background: var(--modal-bg);
            color: var(--text-color);
            padding: 32px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }
        .menu-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .menu-desc {
            font-size: 14px;
            color: var(--modal-desc);
            margin-bottom: 20px;
        }
        .menu-section-title {
            font-size: 14px;
            font-weight: bold;
            margin-top: 16px;
            margin-bottom: 8px;
            text-align: left;
            color: var(--modal-desc);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 8px;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-hard { background-color: #f59e0b; }
        .btn-normal { background-color: #3b82f6; }
        .btn-easy { background-color: #10b981; }
        .btn-gray { background-color: #64748b; }

        /* スコア一覧のスタイル */
        .score-list {
            text-align: left;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .score-item {
            background: var(--header-bg);
            border: 1px solid var(--header-border);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-label {
            font-weight: bold;
            font-size: 14px;
        }
        .score-value {
            font-size: 15px;
            font-weight: bold;
        }

        /* ヘッダー・ステータス */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            border: 1px solid var(--header-border);
            padding: 8px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 15px;
        }
        .header-btns {
            display: flex;
            gap: 6px;
        }
        .header-btn {
            background: var(--header-btn-bg);
            color: var(--header-btn-color);
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 盤面エリア */
        .board-container {
            overflow: hidden;
            max-width: 100%;
            border: 2px solid var(--board-border);
            border-radius: 8px;
            background: var(--board-border);
        }
        #board {
            display: grid;
            gap: 1px;
            background: var(--board-border);
        }
        .cell {
            background-color: var(--cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 1px 1px 0px rgba(255,255,255,0.4), inset -1px -1px 0px rgba(0,0,0,0.3);
        }
        .cell:hover { background-color: var(--cell-hover); }
        .cell.revealed {
            background-color: var(--cell-revealed);
            box-shadow: inset 1px 1px 1px rgba(0,0,0,0.05);
        }
        .cell.mine { background-color: #ef4444; color: white; }

        /* フッターモード切り替え */
        .footer-controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 12px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--mode-btn-border);
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            background: var(--mode-btn-bg);
            color: var(--mode-btn-color);
            cursor: pointer;
        }
        .mode-btn.active {
            background: #3b82f6 !important;
            color: white !important;
            border-color: #3b82f6 !important;
        }
        .mode-btn.flag-active {
            background: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }

        /* モーダル */
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-card {
            background: var(--modal-bg);
            color: var(--text-color);
            padding: 32px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }

        /* 数字の色 */
        .c-1 { color: #3b82f6; }
        .c-2 { color: #10b981; }
        .c-3 { color: #ef4444; }
        .c-4 { color: #8b5cf6; }
        .c-5 { color: #f97316; }
        .c-6 { color: #06b6d4; }
        .c-7 { color: var(--text-color); }
        .c-8 { color: #64748b; }
    </style>
</head>
<body>

    <!-- メニュー画面 -->
    <div id="menuScreen">
        <div class="menu-card">
            <div style="font-size: 40px; margin-bottom: 6px;">💣</div>
            <div class="menu-title">マインスイーパ</div>
            <div class="menu-desc">長押しで旗、スコア記録に対応</div>
            
            <div class="menu-section-title">難易度を選択</div>
            <button class="btn btn-hard" onclick="initGame('hard')">ハード (24×24 / 99個)<br><small style="font-weight:normal;opacity:0.9;">ベスト: <span id="best-hard">--</span>秒</small></button>
            <button class="btn btn-normal" onclick="initGame('normal')">ノーマル (16×16 / 40個)<br><small style="font-weight:normal;opacity:0.9;">ベスト: <span id="best-normal">--</span>秒</small></button>
            <button class="btn btn-easy" onclick="initGame('easy')">イージー (10×10 / 10個)<br><small style="font-weight:normal;opacity:0.9;">ベスト: <span id="best-easy">--</span>秒</small></button>

            <button class="btn btn-gray" style="margin-top: 8px;" onclick="openScoreScreen()">📊 戦績を見る</button>
            
            <!-- ゲーム中の場合のみ表示する閉じるボタン -->
            <button id="btnCloseMenu" class="btn btn-gray" style="background-color: #334155; display: none;" onclick="closeMenu()">✖ 閉じる</button>
        </div>
    </div>

    <!-- 戦績確認画面 -->
    <div id="scoreScreen" style="display: none;">
        <div class="menu-card">
            <div style="font-size: 32px; margin-bottom: 6px;">🏆</div>
            <div class="menu-title">戦績（ベストタイム）</div>
            <div class="menu-desc" style="margin-bottom: 16px;">これまでの最高記録</div>
            
            <div class="score-list">
                <div class="score-item">
                    <span class="score-label">ハード</span>
                    <span class="score-value"><span id="score-hard">--</span> 秒</span>
                </div>
                <div class="score-item">
                    <span class="score-label">ノーマル</span>
                    <span class="score-value"><span id="score-normal">--</span> 秒</span>
                </div>
                <div class="score-item">
                    <span class="score-label">イージー</span>
                    <span class="score-value"><span id="score-easy">--</span> 秒</span>
                </div>
            </div>

            <button class="btn btn-normal" onclick="closeScoreScreen()">戻る</button>
            <button class="btn btn-gray" style="background-color: #ef4444; font-size: 13px; padding: 8px;" onclick="resetScores()">記録をリセット</button>
        </div>
    </div>

    <!-- ゲーム本体 -->
    <div class="game-wrapper">
        <header>
            <div>🚩 <span id="mineCount">0</span></div>
            <div class="header-btns">
                <button class="header-btn" onclick="openMenu()">メニュー</button>
            </div>
            <div>⏱️ <span id="timer">0</span></div>
        </header>

        <div class="board-container">
            <div id="board"></div>
        </div>

        <div class="footer-controls">
            <button id="btnOpen" class="mode-btn active" onclick="setMode('open')">🔍 掘る</button>
            <button id="btnFlag" class="mode-btn" onclick="setMode('flag')">🚩 旗モード</button>
        </div>
    </div>

    <!-- 結果モーダル -->
    <div id="modal">
        <div class="modal-card">
            <div id="modalEmoji" style="font-size: 40px; margin-bottom: 10px;">🎉</div>
            <div id="modalTitle" style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">クリア！</div>
            <p id="modalText" style="font-size: 14px; color: var(--modal-desc); margin-bottom: 20px;"></p>
            <button class="btn btn-normal" style="margin-bottom: 8px;" onclick="openMenu()">メニューに戻る</button>
            <button class="btn btn-easy" style="margin-bottom: 8px;" onclick="retryGame()">🔄 リトライ（もう一度プレイ）</button>
            <button class="btn btn-gray" style="background-color: #334155;" onclick="closeModal()">✖ 閉じる</button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            updateBestScoresDisplay();
        });

        function getBestScores() {
            try {
                return JSON.parse(localStorage.getItem('minesweeper_best')) || { easy: null, normal: null, hard: null };
            } catch (e) {
                return { easy: null, normal: null, hard: null };
            }
        }

        function saveBestScore(level, time) {
            const scores = getBestScores();
            if (scores[level] === null || time < scores[level]) {
                scores[level] = time;
                localStorage.setItem('minesweeper_best', JSON.stringify(scores));
                return true;
            }
            return false;
        }

        function updateBestScoresDisplay() {
            const scores = getBestScores();
            ['easy', 'normal', 'hard'].forEach(lvl => {
                const el = document.getElementById(`best-${lvl}`);
                const scoreEl = document.getElementById(`score-${lvl}`);
                const val = scores[lvl] !== null ? scores[lvl] : '--';
                if (el) el.textContent = val;
                if (scoreEl) scoreEl.textContent = val;
            });
        }

        function openScoreScreen() {
            updateBestScoresDisplay();
            document.getElementById('scoreScreen').style.display = 'flex';
        }

        function closeScoreScreen() {
            document.getElementById('scoreScreen').style.display = 'none';
        }

        function resetScores() {
            if (confirm('本当にすべての記録をリセットしますか？')) {
                localStorage.removeItem('minesweeper_best');
                updateBestScoresDisplay();
            }
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                if (type === 'dig') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'flag') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'boom') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        let o = ctx.createOscillator();
                        let g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(freq, now + i * 0.1);
                        g.gain.setValueAtTime(0.2, now + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
                        o.start(now + i * 0.1);
                        o.stop(now + i * 0.1 + 0.2);
                    });
                }
            } catch (e) {}
        }

        const configs = {
            easy: { key: 'easy', rows: 10, cols: 10, mines: 10 },
            normal: { key: 'normal', rows: 16, cols: 16, mines: 40 },
            hard: { key: 'hard', rows: 24, cols: 24, mines: 99 }
        };

        let currentConfig = configs.easy;
        let boardData = [];
        let gameOver = false;
        let gameStarted = false;
        let timer = 0;
        let timerInterval = null;
        let flagMode = false;
        let revealedCount = 0;

        function openMenu() {
            const closeBtn = document.getElementById('btnCloseMenu');
            if (boardData.length > 0) {
                closeBtn.style.display = 'block';
                if (!gameOver) {
                    clearInterval(timerInterval);
                }
            } else {
                closeBtn.style.display = 'none';
            }

            updateBestScoresDisplay();
            document.getElementById('menuScreen').style.display = 'flex';
            document.getElementById('scoreScreen').style.display = 'none';
            document.getElementById('modal').style.display = 'none';
        }

        function closeMenu() {
            document.getElementById('menuScreen').style.display = 'none';
            if (!gameOver && gameStarted) {
                startTimer();
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function retryGame() {
            initGame(currentConfig.key);
        }

        function setMode(mode) {
            flagMode = (mode === 'flag');
            document.getElementById('btnOpen').className = `mode-btn ${!flagMode ? 'active' : ''}`;
            document.getElementById('btnFlag').className = `mode-btn ${flagMode ? 'flag-active' : ''}`;
        }

        function initGame(level) {
            currentConfig = configs[level];
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('scoreScreen').style.display = 'none';
            document.getElementById('modal').style.display = 'none';

            boardData = [];
            gameOver = false;
            gameStarted = false;
            timer = 0;
            revealedCount = 0;
            clearInterval(timerInterval);
            document.getElementById('timer').textContent = '0';
            document.getElementById('mineCount').textContent = currentConfig.mines;
            setMode('open');

            const maxW = window.innerWidth - 32;
            const maxH = window.innerHeight - 150;
            let cellSize = Math.floor(Math.min(maxW / currentConfig.cols, maxH / currentConfig.rows));
            cellSize = Math.max(16, Math.min(32, cellSize));

            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${currentConfig.cols}, ${cellSize}px)`;
            boardEl.innerHTML = '';

            for (let r = 0; r < currentConfig.rows; r++) {
                boardData[r] = [];
                for (let c = 0; c < currentConfig.cols; c++) {
                    const cell = {
                        row: r,
                        col: c,
                        mine: false,
                        revealed: false,
                        flagged: false,
                        count: 0
                    };
                    boardData[r][c] = cell;

                    const el = document.createElement('div');
                    el.className = 'cell';
                    el.style.width = `${cellSize}px`;
                    el.style.height = `${cellSize}px`;
                    el.style.fontSize = `${Math.max(11, cellSize * 0.45)}px`;
                    el.dataset.row = r;
                    el.dataset.col = c;

                    let pressTimer = null;
                    let isLongPress = false;

                    const startPress = (e) => {
                        if (gameOver || e.button === 2) return;
                        isLongPress = false;
                        pressTimer = setTimeout(() => {
                            isLongPress = true;
                            handleCellRightClick(r, c);
                            if (navigator.vibrate) navigator.vibrate(50);
                        }, 400);
                    };

                    const cancelPress = () => {
                        if (pressTimer) {
                            clearTimeout(pressTimer);
                            pressTimer = null;
                        }
                    };

                    el.addEventListener('mousedown', startPress);
                    el.addEventListener('touchstart', startPress, {passive: true});

                    el.addEventListener('mouseup', (e) => {
                        cancelPress();
                        if (e.button === 2) return;
                        if (!isLongPress) {
                            handleCellClick(r, c);
                        }
                    });
                    
                    el.addEventListener('touchend', (e) => {
                        cancelPress();
                        if (!isLongPress) {
                            e.preventDefault();
                            handleCellClick(r, c);
                        }
                    });

                    el.addEventListener('mouseleave', cancelPress);
                    el.addEventListener('touchmove', cancelPress);

                    el.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellRightClick(r, c);
                    });

                    boardEl.appendChild(el);
                    cell.element = el;
                }
            }
        }

        function generateMines(firstR, firstC) {
            let placed = 0;
            while (placed < currentConfig.mines) {
                let r = Math.floor(Math.random() * currentConfig.rows);
                let c = Math.floor(Math.random() * currentConfig.cols);
                
                let isAroundFirst = Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1;
                if (isAroundFirst || boardData[r][c].mine) continue;
                
                boardData[r][c].mine = true;
                placed++;
            }

            for (let r = 0; r < currentConfig.rows; r++) {
                for (let c = 0; c < currentConfig.cols; c++) {
                    if (boardData[r][c].mine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
                                if (boardData[nr][nc].mine) count++;
                            }
                        }
                    }
                    boardData[r][c].count = count;
                }
            }
        }

        function startTimer() {
            gameStarted = true;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer++;
                if (timer > 999) timer = 999;
                document.getElementById('timer').textContent = timer;
            }, 1000);
        }

        function handleCellClick(r, c) {
            if (gameOver) return;
            const cell = boardData[r][c];

            if (flagMode) {
                handleCellRightClick(r, c);
                return;
            }

            if (cell.flagged || cell.revealed) return;

            if (!gameStarted) {
                generateMines(r, c);
                startTimer();
            }

            if (cell.mine) {
                playSound('boom');
                revealAllMines();
                cell.element.classList.add('mine');
                cell.element.textContent = '💥';
                endGame(false);
                return;
            }

            revealCell(r, c);
            if (!gameOver) {
                playSound('dig');
            }
            checkWin();
        }

        function handleCellRightClick(r, c) {
            if (gameOver) return;
            const cell = boardData[r][c];
            if (cell.revealed) return;

            if (!gameStarted) {
                generateMines(r, c);
                startTimer();
            }

            cell.flagged = !cell.flagged;
            cell.element.textContent = cell.flagged ? '🚩' : '';
            playSound('flag');
            
            updateMineCount();
        }

        function updateMineCount() {
            let flags = 0;
            for (let r = 0; r < currentConfig.rows; r++) {
                for (let c = 0; c < currentConfig.cols; c++) {
                    if (boardData[r][c].flagged) flags++;
                }
            }
            document.getElementById('mineCount').textContent = Math.max(0, currentConfig.mines - flags);
        }

        function revealCell(r, c) {
            const cell = boardData[r][c];
            if (cell.revealed || cell.flagged) return;

            cell.revealed = true;
            revealedCount++;
            cell.element.classList.add('revealed');

            if (cell.count > 0) {
                cell.element.textContent = cell.count;
                cell.element.className = `cell revealed c-${cell.count}`;
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < currentConfig.rows && nc >= 0 && nc < currentConfig.cols) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        function revealAllMines() {
            for (let r = 0; r < currentConfig.rows; r++) {
                for (let c = 0; c < currentConfig.cols; c++) {
                    if (boardData[r][c].mine) {
                        boardData[r][c].element.textContent = '💣';
                        boardData[r][c].element.classList.add('revealed');
                    }
                }
            }
        }

        function checkWin() {
            if (revealedCount === (currentConfig.rows * currentConfig.cols - currentConfig.mines)) {
                playSound('win');
                endGame(true);
            }
        }

        function endGame(isWin) {
            gameOver = true;
            clearInterval(timerInterval);

            const modal = document.getElementById('modal');
            const emoji = document.getElementById('modalEmoji');
            const title = document.getElementById('modalTitle');
            const text = document.getElementById('modalText');

            if (isWin) {
                emoji.textContent = '🎉';
                title.textContent = 'クリア！';
                const isNewBest = saveBestScore(currentConfig.key, timer);
                if (isNewBest) {
                    text.textContent = `タイム: ${timer}秒 (新記録達成！)`;
                } else {
                    text.textContent = `タイム: ${timer}秒で見事にクリアしました！`;
                }
            } else {
                emoji.textContent = '💥';
                title.textContent = 'ゲームオーバー';
                text.textContent = '地雷を踏んでしまいました…。';
            }
            modal.style.display = 'flex';
        }
    </script>
</body>
</html>
