<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Game Archive - マイゲーム置き場</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .site-title {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 16px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: var(--text-color);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--accent-color);
        }

        .game-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .game-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .game-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .game-link-text {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        footer {
            margin-top: auto;
            padding-top: 32px;
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="site-title">🎮 AI Game Archive</div>
    </header>

    <div class="container">
        <div class="section-title">公開中のゲーム一覧</div>
        
        <div class="game-grid">
            <a href="mine.html" class="game-card">
                <div>
                    <div class="game-icon">💣</div>
                    <div class="game-name">マインスイーパ</div>
                </div>
                <div class="game-link-text">プレイする →</div>
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 AI Game Archive. Built with AI.</p>
    </footer>

</body>
</html>
